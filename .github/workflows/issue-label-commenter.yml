name: "Comment on issues by label"
on:
  issues:
    types: [labeled]

jobs:
  comment:
    # Only greet issues that have not been replied to yet.
    # 'issue.comments' is the comment count, so compare it directly.
    if: github.event.issue.comments == 0
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: peaceiris/actions-label-commenter@v1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        config_file: .github/issue-commenter.yml
